name: Update models

on:
  schedule:
    - cron: "7 0 * * *" # 07:07 Asia/Ho_Chi_Minh
  workflow_dispatch:

# The release is tagged and handed to publish.yml, which owns npm Trusted
# Publishing for this package. Tags pushed with GITHUB_TOKEN don't trigger
# workflows, so publish.yml is dispatched explicitly.
permissions:
  contents: write
  actions: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch the model catalog
        env:
          CORALBRICKS_API_KEY: ${{ secrets.CORALBRICKS_API_KEY }}
        run: node scripts/update-models.js

      - name: Commit, bump and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No model changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: update coralbricks models from API"
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v$version"
          git tag "v$version"
          git push --atomic origin HEAD:main "refs/tags/v$version"
          gh workflow run publish.yml --ref "v$version"
          echo "Release v$version queued via publish.yml."
